# Full TimeTracker stack (dev + single-VM production).
#   postgres  -> LOCAL dev database (profile: local)                   :5432
#   minio     -> LOCAL dev object storage (profile: local)             :9100 (S3) / :9001 (console)
#   server    -> Axum API server, built from ./Dockerfile              :9000
#   admin-web -> Next.js admin dashboard, built from ./Dockerfile.admin :3001 (internal)
#   nginx     -> reverse proxy / web entrypoint                        :80
#
# The desktop app is a native Tauri app and is NOT containerized; it talks to the
# API directly on :9000 and uploads screenshots straight to object storage.
#
# Web entrypoint (browser): http://<VM_HOST>/  -> dashboard, http://<VM_HOST>/api -> API.
#
# Two run modes:
#   Local dev (self-contained: local Postgres + MinIO):
#     docker compose --profile local up -d --build
#   Production (managed DB + GCS; nothing stateful on the VM):
#     Set DATABASE_URL (managed Postgres, e.g. Supabase) and S3_* (GCS) in .env,
#     then: docker compose up -d --build     # starts ONLY server, admin-web, nginx
#
#   docker compose down     # stop (keeps volumes)
#
# In production the `postgres`/`minio` services are gated behind the `local`
# profile, so `docker compose up` does NOT start them and the VM holds no
# database — the source of truth (Rule 4) is the managed DB behind DATABASE_URL.

name: timetracker

# Cap every container's logs so they can never fill the disk (the root cause of
# the Postgres "No space left on device" outage). Each service keeps at most
# 3 x 10MB = 30MB of logs, rotated. Applied to all services via *default-logging.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    container_name: timetracker-postgres
    # LOCAL DEV ONLY. In production the database is a managed service (Supabase /
    # Cloud SQL) reached via DATABASE_URL, so this container is not started.
    profiles: ["local"]
    restart: unless-stopped
    logging: *default-logging
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-timetracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-timetracker}
      POSTGRES_DB: ${POSTGRES_DB:-timetracker}
    ports:
      # SEC-04: loopback only — never publish the database to the internet.
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U timetracker -d timetracker"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    container_name: timetracker-minio
    # LOCAL DEV ONLY. Production uses GCS/R2 via the S3_* env vars.
    profiles: ["local"]
    restart: unless-stopped
    logging: *default-logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # SEC-04: loopback only. The console must never be public; for self-hosted
      # direct client uploads, front the S3 API behind the TLS proxy rather than
      # publishing this port. (Production uses GCS/R2, not this MinIO.)
      - "127.0.0.1:9100:9000"   # S3 API on host :9100
      - "127.0.0.1:9001:9001"   # Web console
    volumes:
      - minio_data:/data

  # One-shot job: create the screenshots bucket so the app can upload immediately.
  # Retries until MinIO accepts connections (no dependency on a server healthcheck,
  # which the minio image's missing tooling makes unreliable).
  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    container_name: timetracker-minio-init
    # LOCAL DEV ONLY (creates the local MinIO bucket).
    profiles: ["local"]
    logging: *default-logging
    depends_on:
      minio:
        condition: service_started
    # RA-18: reuse the same root creds as the minio service (was hardcoded
    # 'minioadmin', which broke bucket init whenever the creds were changed).
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$MINIO_ROOT_USER\" \"$$MINIO_ROOT_PASSWORD\"; do
        echo 'waiting for minio...'; sleep 2;
      done &&
      mc mb --ignore-existing local/screenshots &&
      mc anonymous set none local/screenshots &&
      echo 'MinIO bucket ready: screenshots';
      "

  # API server — built from ./Dockerfile, exposed on :9000. Talks to the
  # postgres + minio services over the compose network. Secrets are read from
  # the project .env via ${VAR} interpolation (with safe dev defaults).
  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: timetracker-server
    restart: unless-stopped
    logging: *default-logging
    # Inject the whole .env so vars NOT listed under `environment:` below
    # (e.g. SMTP_HOST/PORT/USER/PASS/FROM for email) still reach the container.
    # `required: false` => dev without a .env still works. The explicit
    # `environment:` keys below take precedence over these.
    env_file:
      - path: .env
        required: false
    # `required: false` => these are awaited only when started (i.e. the `local`
    # profile is active). In production they are absent and the server connects
    # straight to the managed DB / GCS, so it is not blocked by them.
    depends_on:
      postgres:
        condition: service_healthy
        required: false
      minio-init:
        condition: service_completed_successfully
        required: false
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: "9000"
      # Managed DB in production: set DATABASE_URL in .env to the Supabase/Cloud SQL
      # connection string (use the SESSION-mode pooler + ?sslmode=require — the
      # transaction pooler breaks SQLx prepared statements). Falls back to the
      # local `postgres` service for `--profile local` dev.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-timetracker}:${POSTGRES_PASSWORD:-timetracker}@postgres:5432/${POSTGRES_DB:-timetracker}}
      DATABASE_MAX_CONNECTIONS: "10"
      # SEC-07: required (>=32 chars). Set in .env: openssl rand -base64 48
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET in .env (openssl rand -base64 48)}
      JWT_ACCESS_TTL_SECONDS: "300"
      JWT_REFRESH_TTL_SECONDS: "2592000"
      # Presigned-URL host: must be reachable by clients. Locally that's MinIO's
      # published port (localhost:9100); on a VM set S3_ENDPOINT in .env to the
      # public address (or a Cloudflare R2 endpoint). Driven by .env so the same
      # compose file works in dev and prod.
      S3_ENDPOINT: ${S3_ENDPOINT:-http://localhost:9100}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET:-screenshots}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-minioadmin}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-minioadmin}
      # SEC-03: allows the minioadmin dev default; set false + real keys in prod.
      S3_ALLOW_INSECURE_DEFAULTS: ${S3_ALLOW_INSECURE_DEFAULTS:-true}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:9000}
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      # Vision AI can use xAI Grok instead of Claude — set XAI_API_KEY and it
      # takes precedence (model via XAI_MODEL, default grok-4.5).
      XAI_API_KEY: ${XAI_API_KEY:-}
      XAI_MODEL: ${XAI_MODEL:-}
      RUST_LOG: ${RUST_LOG:-info,server=info,sqlx=warn}
    ports:
      # SEC-04/SEC-21: bind to loopback so the API is reachable only via nginx,
      # not published to the internet. Change to "9000:9000" only for direct
      # local access without the proxy.
      - "127.0.0.1:9000:9000"

  # Admin dashboard (Next.js). NEXT_PUBLIC_API_BASE_URL is inlined at BUILD time,
  # so it is passed as a build arg (not a runtime env). Default "/api" => the
  # browser makes same-origin calls that Nginx routes to the API container.
  admin-web:
    build:
      context: .
      dockerfile: Dockerfile.admin
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    container_name: timetracker-admin-web
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - server
    expose:
      - "3001"   # internal only; reached through Nginx

  # Employee dashboard (Next.js). Same pattern as admin-web, but mounted behind
  # Nginx at /employee (NEXT_BASE_PATH baked in at build time). Same-origin /api.
  employee-web:
    build:
      context: .
      dockerfile: Dockerfile.employee
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    container_name: timetracker-employee-web
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - server
    expose:
      - "3002"   # internal only; reached through Nginx

  # Reverse proxy / single web entrypoint on :80.
  #   /     -> admin-web:3001
  #   /api/ -> server:9000  (prefix stripped)
  nginx:
    image: nginx:1.27-alpine
    container_name: timetracker-nginx
    restart: unless-stopped
    logging: *default-logging
    depends_on:
      - admin-web
      - employee-web
      - server
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

volumes:
  postgres_data:
  minio_data:
