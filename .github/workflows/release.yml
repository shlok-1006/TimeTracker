name: Release (desktop installers)

# Build signed-ready installers for Windows, macOS, and Linux.
# Trigger by pushing a tag like `v0.1.0`, or run manually.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: Build ${{ matrix.platform }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          # One universal binary covers Apple Silicon AND Intel. (The old
          # macos-13 Intel runners are retired — jobs queue forever.)
          - platform: macos-latest
            args: --target universal-apple-darwin
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          # X11 dev packages: needed by the screenshot (xcap) and idle-detection
          # (x11/xscrnsaver) crates; the runner image stopped shipping them.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libgtk-3-dev libxdo-dev \
            libx11-dev libxcb1-dev libxrandr-dev libdbus-1-dev \
            libxss-dev libxtst-dev libxi-dev libxinerama-dev libxcursor-dev \
            libxfixes-dev libxext-dev libudev-dev libinput-dev \
            libpipewire-0.3-dev libspa-0.2-dev libgbm-dev libdrm-dev

      # pnpm version comes from the "packageManager" field in package.json —
      # specifying it here too makes pnpm/action-setup fail on the conflict.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # tauri-action builds the frontend (beforeBuildCommand) and bundles the
      # platform installer (.msi/.exe, .dmg/.app, .deb/.AppImage), then uploads.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Desktop API base for production builds (override per environment).
          TIMETRACKER_API_BASE_URL: ${{ vars.TIMETRACKER_API_BASE_URL || 'http://localhost:8090' }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: "TimeTracker ${{ github.ref_name }}"
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
