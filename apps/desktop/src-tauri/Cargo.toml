[package]
name = "timetracker-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "TimeTracker desktop application (Tauri 2 shell)"

# The Tauri app is split into a library (so it can target mobile / be tested) and
# a thin binary. See Tauri 2 project conventions.
[lib]
name = "timetracker_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: needed by tauri-nspanel (reminder panel, below). Only bars
# Mac App Store distribution, which TimeTracker does not use.
tauri = { version = "2", features = ["macos-private-api"] }
# Native break-reminder notifications + launch-at-login (both driven from Rust,
# so no frontend plugin plumbing needed).
tauri-plugin-autostart = "2"
# Single-instance guard: with launch-at-login enabled, don't open a second copy
# if one is already running — focus the existing window instead.
tauri-plugin-single-instance = "2"
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
# Local SQLite source-of-truth (Rule 1). Wired into a real db module in a later step.
sqlx = { workspace = true }
# SHA-384 of migration SQL variants — self-heal for line-ending-only checksum
# drift in _sqlx_migrations (pre-.gitattributes builds embedded CRLF).
sha2 = { workspace = true }
# Native message box so startup failures are visible instead of a silent crash
# loop (the release binary is windowed — panics have no console). gtk3 backend
# on Linux matches the GTK stack Tauri already links.
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
# HTTP client to talk to the API server. Built to work behind corporate VPNs:
#   * rustls-tls-native-roots — also trust the OS certificate store, so a VPN
#     that inspects HTTPS with its own root CA (Zscaler, Netskope, FortiClient…)
#     is accepted exactly as the browser accepts it. The bundled Mozilla roots
#     (rustls-tls) stay as the fallback.
#   * system-proxy — honour the macOS / Windows system proxy a VPN may install.
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "rustls-tls-native-roots",
    "system-proxy",
] }
thiserror = { workspace = true }
anyhow = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
# Randomized screenshot cadence: pick each next-capture delay from a window so
# the interval is unpredictable (anti-gaming) rather than a fixed 5 minutes.
rand = "0.8"
# Encrypts screenshots queued on disk while the server is unreachable (outbox).
# XChaCha20-Poly1305: random 24-byte nonces are safe, no counter to persist.
chacha20poly1305 = "0.10"
# OS-native idle timer for idle detection (Rule: idle.rs). Uses CoreGraphics on
# macOS (no Input-Monitoring permission needed) and GetLastInputInfo on Windows.
user-idle = "0.6"
# Screen capture (Rule: screenshot.rs) + JPEG encoding. `image` must match the
# version xcap depends on (^0.25) so RgbaImage types unify.
xcap = "0.9"
image = "0.25"
active-win-pos-rs = "0.11.0"
# One-click updates: downloads the signed update from the downloads repo,
# installs it over this copy, then the app restarts into it (updates.rs).
tauri-plugin-updater = "2"
iana-time-zone = "0.1.65"

# Secure token storage in the OS keychain (Rule 6).
# keyring v3 makes the platform backend OPT-IN — without a native feature it
# silently falls back to a non-persistent in-memory mock store. Enable the real
# OS credential store per platform.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
# Reads which apps are using the microphone (call detection, call_detect.rs).
winreg = "0.55"

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
# AppKit window level / Spaces behaviour for the reminder window, so it floats
# over every app — including ones in full screen. Same version Tauri uses.
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSResponder", "NSWindow"] }
# Turns the reminder window into a non-activating NSPanel: the only kind of
# window macOS shows over another app's full-screen Space.
tauri-nspanel = "2.1"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[features]
# Used by `tauri dev`/`tauri build` to enable webview devtools, etc.
custom-protocol = ["tauri/custom-protocol"]
